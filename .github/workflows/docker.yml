name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t securetrack-php .

      - name: Tag Docker Image
        run: |
          docker tag securetrack-php:latest 954935267670.dkr.ecr.us-east-1.amazonaws.com/securetrack-php-repo:latest

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securetrack-php:latest
          format: table
          severity: CRITICAL,HIGH

      - name: Push Docker Image
        run: |
          docker push 954935267670.dkr.ecr.us-east-1.amazonaws.com/securetrack-php-repo:latest
